name: Build Windows Release

on:
  push:
    branches: [master]
    tags: ['v*']
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Verify model files exist
        shell: pwsh
        run: |
          $models = @(
            "src-tauri/models/ch_PP-OCRv4_det_infer.onnx",
            "src-tauri/models/ch_ppocr_mobile_v2.0_cls_infer.onnx",
            "src-tauri/models/ch_PP-OCRv4_rec_infer.onnx",
            "src-tauri/models/ppocr_keys_v1.txt"
          )
          foreach ($m in $models) {
            if (-not (Test-Path $m)) {
              Write-Error "Missing model file: $m"
              exit 1
            }
            $size = (Get-Item $m).Length / 1MB
            Write-Host "$m : $([math]::Round($size, 2)) MB"
          }

      - name: Install frontend dependencies
        run: npm install

      - name: Build frontend
        run: npx vue-tsc --noEmit && npx vite build

      - name: Build Tauri app (Release)
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          Write-Host "Starting Tauri build..."
          npx tauri build --bundles nsis 2>&1 | Write-Host
          Write-Host "Build completed with exit code: $LASTEXITCODE"

      - name: List build artifacts
        if: always()
        shell: pwsh
        run: |
          Write-Host "=== Build artifacts ==="
          if (Test-Path "src-tauri/target/release/bundle") {
            Get-ChildItem -Path "src-tauri/target/release/bundle" -Recurse -File | ForEach-Object {
              $size = [math]::Round($_.Length / 1MB, 2)
              Write-Host "$($_.FullName) : $size MB"
            }
          } else {
            Write-Host "No bundle directory found"
          }
          Write-Host ""
          Write-Host "=== Release directory DLLs ==="
          if (Test-Path "src-tauri/target/release") {
            Get-ChildItem -Path "src-tauri/target/release" -Filter "*.dll" | ForEach-Object {
              $size = [math]::Round($_.Length / 1MB, 2)
              Write-Host "$($_.Name) : $size MB"
            }
          }
          Write-Host ""
          Write-Host "=== Release exe ==="
          if (Test-Path "src-tauri/target/release/invoice-reimbursement.exe") {
            $size = [math]::Round((Get-Item "src-tauri/target/release/invoice-reimbursement.exe").Length / 1MB, 2)
            Write-Host "invoice-reimbursement.exe : $size MB"
          }

      - name: Upload NSIS installer
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: invoice-reimbursement-windows-installer
          path: src-tauri/target/release/bundle/nsis/*.exe
          retention-days: 30

      - name: Upload portable bundle
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: invoice-reimbursement-windows-portable
          path: |
            src-tauri/target/release/invoice-reimbursement.exe
            src-tauri/target/release/onnxruntime*.dll
          retention-days: 30
