[package]
name = "invoice-reimbursement"
version = "0.5.0"
description = "发票报销助手"
authors = ["白开水"]
edition = "2021"
default-run = "invoice-reimbursement"

[lib]
name = "invoice_reimbursement_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[[bin]]
name = "generate_report"
path = "src/bin/generate_report.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
reqwest = { version = "0.12", features = ["json", "multipart"] }
tokio = { version = "1", features = ["sync"] }
regex = "1"
uuid = { version = "1", features = ["v4"] }
calamine = "0.26"
genpdf = "0.2"
ocr-rs = "2.2.2"
image = { version = "0.25", default-features = false }
zpdf = "0.9"
encoding_rs = "0.8"
parangi = "0.1.0"
printpdf = { version = "0.7", features = ["embedded_images"] }
base64 = "0.22"
rust_xlsxwriter = "0.82"
# ponytail: fork branch cjk-safe-lenient
# = 0a436bf (0.2.0+bbox, CJK 0%) + PR#214 (tokenize_lenient <<修复) + PR#243 (word split >= 语义)
# + 9e59889 (fill 路径自动闭合 + 近似矩形) + c2ab510 (bar-rect 单边 + 按行成格，修复发票单元格提取)
# 上游 a8dc8b1 破坏 Identity-H CID fallback（CID 当 Unicode → 中文乱码），jacob-cotten fork 同样回归
# PR#206 Adobe CID 表对 subset 字体有害（中国发票几乎都是 subset），不合入
pdfplumber = { git = "https://github.com/chenfuxu920/pdfplumber-rs.git", branch = "cjk-safe-lenient", optional = true }

[features]
default = ["pdfplumber"]
pdfplumber = ["dep:pdfplumber"]

[dev-dependencies]
tempfile = "3"

[profile.release]
opt-level = "z"
lto = "fat"
strip = true
codegen-units = 1

# 日常测试用：继承 release 的 opt-level/strip，但关掉 LTO、开多线程编译
# cargo build --profile release-fast  或  tauri build --profile release-fast
[profile.release-fast]
inherits = "release"
lto = false
codegen-units = 16
