[package]
name = "invoice-reimbursement"
version = "1.3.0"
description = "发票报销助手"
license = "MIT"
authors = ["白开水"]
edition = "2021"
default-run = "invoice-reimbursement"

[lib]
name = "invoice_reimbursement_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[[bin]]
name = "generate_report"
path = "src/bin/generate_report.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-opener = "2"
tauri-plugin-process = "2"
tauri-plugin-updater = "2"
minisign = "0.9"
semver = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
reqwest = { version = "0.12", features = ["json", "multipart"] }
tokio = { version = "1", features = ["sync"] }
regex = "1"
uuid = { version = "1", features = ["v4"] }
calamine = "0.26"
genpdf = "0.2"
ocr-rs = "2.2.2"
image = { version = "0.25", default-features = false }
zpdf = "0.11"
encoding_rs = "0.8"
medpdf = "0.9.2"
lopdf = "0.39"
allsorts = "0.16"
ttf-parser = "0.25"
base64 = "0.22"
rust_xlsxwriter = "0.82"
# ponytail: fork main 分支（合并上游修改后的最新版）
# = 原 cjk-safe-lenient 全部修复（CJK CID / ASCII 宽度 / table/annot/Contents）+ 上游更新
#   main@8a70f45 含 39ae2cd（CJK/字段暴露）+ 8a70f45（补 Word.font_flags/stem_v）
pdfplumber = { git = "https://github.com/chenfuxu920/pdfplumber-rs.git", branch = "main", optional = true }

[features]
default = ["pdfplumber"]
pdfplumber = ["dep:pdfplumber"]

[dev-dependencies]
tempfile = "3"

[profile.release]
opt-level = "z"
lto = "fat"
strip = true
codegen-units = 1

# 日常测试用：继承 release 的 opt-level/strip，但关掉 LTO、开多线程编译
# cargo build --profile release-fast  或  tauri build --profile release-fast
[profile.release-fast]
inherits = "release"
lto = false
codegen-units = 16

# ponytail: fork zpdf to patch zpdf-font (crates.io 0.9.0 未修)
# = chenfuxu920/zpdf main 分支（原 cjk-ascii-width 修复 + 上游修改）
#   98005f6/f6a0412: 修复 Type0 CID 字体 ASCII 字符 2× 过宽（/W 缺 ASCII 条目时 fallback 0.5× /DW）
#   911d61d: 修复 Identity-H 子集字体 CJK 字形被错误半角化（glyph_advance 优先查 hmtx）
[patch.crates-io]
zpdf-font = { git = "https://github.com/chenfuxu920/zpdf.git", branch = "main" }
