[package]
name = "invoice-reimbursement"
version = "1.0.0"
description = "发票报销助手"
license = "MIT"
authors = ["白开水"]
edition = "2021"
default-run = "invoice-reimbursement"

[lib]
name = "invoice_reimbursement_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[[bin]]
name = "generate_report"
path = "src/bin/generate_report.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
reqwest = { version = "0.12", features = ["json", "multipart"] }
tokio = { version = "1", features = ["sync"] }
regex = "1"
uuid = { version = "1", features = ["v4"] }
calamine = "0.26"
genpdf = "0.2"
ocr-rs = "2.2.2"
image = { version = "0.25", default-features = false }
zpdf = "0.9"
encoding_rs = "0.8"
medpdf = "0.9.2"
lopdf = "0.39"
allsorts = "0.16"
ttf-parser = "0.25"
base64 = "0.22"
rust_xlsxwriter = "0.82"
# ponytail: fork branch cjk-safe-lenient @ 0bdfaa4 (merge of -full into canonical branch)
# = 24ffb68 (CJK CID 修复) + 0729db5 (Word 字段) + c2ab510/dea587e/369244b (table/annot/Contents)
# + f9444db (ASCII 0x20-0x7E 半角宽度修复)
pdfplumber = { git = "https://github.com/chenfuxu920/pdfplumber-rs.git", branch = "cjk-safe-lenient", optional = true }

[features]
default = ["pdfplumber"]
pdfplumber = ["dep:pdfplumber"]

[dev-dependencies]
tempfile = "3"

[profile.release]
opt-level = "z"
lto = "fat"
strip = true
codegen-units = 1

# 日常测试用：继承 release 的 opt-level/strip，但关掉 LTO、开多线程编译
# cargo build --profile release-fast  或  tauri build --profile release-fast
[profile.release-fast]
inherits = "release"
lto = false
codegen-units = 16

# ponytail: fork zpdf to patch zpdf-font (crates.io 0.9.0 未修)
# = chenfuxu920/zpdf branch cjk-ascii-width
#   98005f6: 修复 Type0 CID 字体 ASCII 0x20-0x7E 字符 2× 过宽（/W 缺 ASCII 条目时 fallback 0.5× /DW）
#   f6a0412: 修复 CID 范围 1..=0x7E 覆盖 GBK-EUC-H 的 CID 1-95（旧范围 0x20-0x7E 漏 CID 1-31，
#            导致 '0'-'9' 等 ASCII 字符 CID 17-26 仍走 /DW=1000 → 2× 过宽）
#   911d61d: 修复 Identity-H 子集字体 CJK 字形被错误半角化（glyph_advance 优先查 hmtx，
#            不再走 1..=0x7E 启发式；legacy CMap 路径不变）
[patch.crates-io]
zpdf-font = { git = "https://github.com/chenfuxu920/zpdf.git", branch = "cjk-ascii-width" }
